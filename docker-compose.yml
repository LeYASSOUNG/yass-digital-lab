# ================================================================
# Yass Digital Lab — Docker Compose (Production-Ready)
# ================================================================
# Services :
#   - postgres  : Base de données PostgreSQL 16
#   - redis     : Cache & Queue driver
#   - backend   : API Laravel 12 (PHP-FPM 8.2) + Nginx
#   - frontend  : SPA Vue 3 (build statique servi par Nginx)
# ================================================================

services:

  # ============================================================
  # PostgreSQL 16 — Base de données principale
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: yass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yass_digital_lab}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yass_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-yass_digital_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — Cache & Sessions
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: yass_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yass_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend — API Laravel 12 (PHP-FPM + Nginx)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: yass_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-yass_digital_lab}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-smtps}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-"Yass Digital Lab"}
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY}
      GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET}
      GENIUSPAY_URL: ${GENIUSPAY_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_storage:/var/www/html/public/storage
    ports:
      - "${BACKEND_PORT:-8000}:80"
    networks:
      - yass_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # Queue Worker — Traitement des jobs asynchrones (emails, etc.)
  # ============================================================
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: yass_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-yass_digital_lab}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - yass_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # Frontend — SPA Vue 3 (Build statique servi par Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: yass_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - yass_network
    depends_on:
      - backend

# ============================================================
# Volumes persistants
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local

# ============================================================
# Réseau interne isolé
# ============================================================
networks:
  yass_network:
    driver: bridge
