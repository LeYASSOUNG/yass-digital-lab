; ================================================================
; PHP Configuration — Yass Digital Lab Production
; ================================================================

; Performance
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; Sécurité
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log

; Session
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Timezone
date.timezone = UTC
