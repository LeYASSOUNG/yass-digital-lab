# ================================================================
# docker-compose.override.yml — Développement Local
# ================================================================
# Ce fichier est lu automatiquement par docker-compose pour
# SURCHARGER docker-compose.yml en développement.
# Ne jamais déployer ce fichier en production !
# ================================================================

services:

  backend:
    build:
      target: production  # utilise le même build mais avec volumes montés
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
    volumes:
      # Monte le code source en direct (hot reload sans rebuild)
      - ./backend:/var/www/html
      - /var/www/html/vendor  # Garde le vendor Docker (ne pas écraser)
      - backend_storage:/var/www/html/storage
    ports:
      - "8000:80"

  frontend:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "80:80"

  postgres:
    ports:
      - "5432:5432"  # Exposer PostgreSQL en local pour pgAdmin/TablePlus

  redis:
    ports:
      - "6379:6379"  # Exposer Redis en local pour Redis Desktop Manager
